name: Web3 terminal isolated tests
on:
  push:
    branches:
      - feature/web3-terminal-test
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run Web3 indicator tests
        run: npx vitest run web3-terminal-test/marketMath.test.ts
      - name: Type-check isolated terminal
        run: npx tsc --noEmit --jsx react-jsx --target ES2022 --module ESNext --moduleResolution Bundler --esModuleInterop --skipLibCheck web3-terminal-test/marketMath.ts web3-terminal-test/Web3TerminalTest.tsx
