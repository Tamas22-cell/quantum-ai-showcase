name: Web3 terminal isolated tests
on:
  push:
    branches:
      - feature/web3-terminal-test
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Web3 indicator tests
        run: bunx vitest run web3-terminal-test/marketMath.test.ts
      - name: Type-check isolated terminal
        run: bunx tsc --noEmit --jsx react-jsx --target ES2022 --module ESNext --moduleResolution Bundler --esModuleInterop --skipLibCheck web3-terminal-test/marketMath.ts web3-terminal-test/Web3TerminalTest.tsx
