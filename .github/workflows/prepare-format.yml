name: Prepare Prettier Cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - name: Format source files (no logic changes)
        run: bunx prettier --write src
      - name: Push formatting to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b cleanup/prettier-20261008
          git add src
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "Format source code with Prettier"
            git push origin HEAD
          fi
