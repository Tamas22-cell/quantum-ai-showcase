name: ESLint Auto Fix Review
on:
  push:
    branches: [cleanup/prettier-20261008]
    paths: [.github/workflows/eslint-autofix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - name: Apply safe ESLint auto fixes
        run: bunx eslint src --fix || true
      - name: Commit review branch fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "Apply ESLint automatic fixes"
            git push origin HEAD
          fi
