name: Production dependency security audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Bun production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Preview compatible dependency fixes (no file changes)
        run: bun audit fix --dry-run || true
      - name: Scan production dependency advisories
        run: bun audit --prod --audit-level=high
