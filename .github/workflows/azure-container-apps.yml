name: Azure Container Apps (manual)
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ensure required environment values exist
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          APP: ${{ vars.AZURE_CONTAINER_APP }}
        run: |
          for var in CLIENT_ID TENANT_ID SUBSCRIPTION_ID RESOURCE_GROUP REGISTRY APP; do
            if [ -z "${!var}" ]; then echo "Missing $var"; exit 1; fi
          done
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push to existing ACR
        env:
          REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
        run: |
          az acr login --name "$REGISTRY"
          docker build -t "$REGISTRY.azurecr.io/quantum-ai-showcase:${GITHUB_SHA}" .
          docker push "$REGISTRY.azurecr.io/quantum-ai-showcase:${GITHUB_SHA}"
      - name: Deploy to existing Container App
        env:
          REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINER_APP }}
        run: |
          az extension add --name containerapp --upgrade
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "$APP" --image "$REGISTRY.azurecr.io/quantum-ai-showcase:${GITHUB_SHA}"
