name: Quantum AI Showcase CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format Bloch component
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin fix/bloch-reference-formatting
          git checkout -B fix/bloch-reference-formatting origin/fix/bloch-reference-formatting
          bunx prettier --write src/components/lab/circuit-bloch-live.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/lab/circuit-bloch-live.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format reference Bloch visualizer"
            git push origin HEAD:fix/bloch-reference-formatting
          fi
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build
